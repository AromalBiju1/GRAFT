name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'pytest>=8.0' 'pytest-asyncio>=0.23' ruff mypy

      - name: Run test suite
        run: python3 -m pytest tests/ -v --tb=short

      - name: Lint
        # Runs even when tests fail, so a PR gets both signals at once.
        if: always()
        run: ruff check .

      - name: Type check
        # Advisory for now: mypy is configured in pyproject.toml but the
        # codebase is not yet annotated to satisfy it. Flip to blocking once
        # the count reaches zero.
        if: always()
        continue-on-error: true
        run: mypy config.py embeddings.py version.py router retrieval modules generation baseline api indexing db tree_store
[project]
name = "graft"
version = "0.1.0"
description = "Gated Retrieval Activation Framework for Trees — adaptive, complexity-aware RAG with hierarchical document trees"
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GRAFT Team", email = "graft@chengannur.ac.in" }]
keywords = ["rag", "retrieval", "llm", "raptor", "vector-store"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "chromadb>=1.0,<2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = [
  "google-genai>=1.0",
  "openai>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.3",
  "mypy>=1.9",
]
embeddings = [
  "sentence-transformers>=3.0",
]
doc-processing = [
  "pypdf>=4.0",
  "python-docx>=1.1",
  "unstructured>=0.14",
]

[project.urls]
Homepage = "https://github.com/AromalBiju1/GRAFT"
Issues = "https://github.com/AromalBiju1/GRAFT/issues"

[project.scripts]
graft-api = "api.main:main"
graft-index = "indexing.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "api",
  "backend",
  "baseline",
  "benchmark",
  "config.py",
  "db",
  "embeddings.py",
  "generation",
  "indexing",
  "modules",
  "retrieval",
  "router",
  "tree_store",
  "vector_store",
  "version.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
  "integration: end-to-end tests that need the real sentence-transformers model (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "db", "indexing", "modules", "retrieval", "router", "vector_store"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["api", "baseline", "db", "embeddings.py", "generation", "indexing", "modules", "retrieval", "router", "tree_store", "vector_store"]
omit = ["tests/*"]
